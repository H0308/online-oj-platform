# 以下是knife4j的增强配置
knife4j:
  enable: true
  production: false # 不用于生产环境
  setting:
    language: zh_cn # 文档语言为中文
sa-token:
  token-name: Authorization      # 和你现在前端传的头一致
  timeout: 43200                 # 12小时，对应你的 AUTHORIZATION_TOKEN_EXPIRE_TIME_HOURS
  is-concurrent: false           # false = 单端登录，新登录踢掉旧的；true = 多端共存
  # 你现在是"旧 token 续着用"，更接近 is-share: true 的玩法，见下方说明
  is-share: true                 # 多端登录共用同一 token（对应你 generateJwtToken 里"有旧的用旧的"）
  token-style: simple            # 配合 jwt 插件，实际样式由 StpLogicJwtForSimple 决定
  jwt-secret-key: ${JWT_SECRET}  # 别再硬编码在代码里了，走环境变量
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-prefix: tb_ # 表前缀
      id-type: ASSIGN_ID # 主键id（雪花算法）
      # 逻辑删除字段。使用逻辑删除，mybatis-plus提供的方法可以不带逻辑删除的查询条件
      logic-delete-field: deleteFlag
      logic-delete-value: true # 逻辑删除值
      logic-not-delete-value: false # 逻辑未删除值
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_ACCESS_BUCKET_NAME}