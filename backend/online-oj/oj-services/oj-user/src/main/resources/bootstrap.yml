server:
  port: 9091
spring:
  application:
    name: oj-user
  datasource:
    url: jdbc:mysql://${DATABASE_IP:localhost}:${DATABASE_PORT:3306}/db_online_oj_platform_user?characterEncoding=utf8&useSSL=false
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
springdoc:
  api-docs:
    path: /v3/api-docs  # 更改 OpenAPI JSON/YAML 描述文件的路径，默认是 /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html  # 更改 Swagger UI 页面的访问路径，默认是 /swagger-ui.html
  packages-to-scan: org.epsda.user.controller  # 指定要扫描的包名列表（逗号分隔），只生成这些包下的接口文档
  paths-to-match: /**  # 指定要匹配的请求路径模式（Ant 风格），仅对符合该规则的接口生成文档
# 以下是knife4j的增强配置
knife4j:
  enable: true
  production: false # 不用于生产环境
  setting:
    language: zh_cn # 文档语言为中文
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-prefix: tb_ # 表前缀
      id-type: ASSIGN_ID # 主键id（雪花算法）
      # 逻辑删除字段。使用逻辑删除，mybatis-plus提供的方法可以不带逻辑删除的查询条件
      logic-delete-field: deleteFlag
      logic-delete-value: true # 逻辑删除值
      logic-not-delete-value: false # 逻辑未删除值